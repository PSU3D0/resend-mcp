name: Update OpenAPI Spec

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-spec:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch and transform spec
        run: |
          curl -sL https://raw.githubusercontent.com/resend/resend-openapi/main/resend.yaml -o /tmp/resend-upstream.yaml
          python scripts/transform_spec.py /tmp/resend-upstream.yaml /tmp/resend-transformed.yaml

      - name: Check for changes
        id: diff
        run: |
          if diff -q src/specs/resend.yaml /tmp/resend-transformed.yaml > /dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Save diff to repo directory (Claude can only access repo files)
            diff -u src/specs/resend.yaml /tmp/resend-transformed.yaml > .github/spec.diff || true
          fi

      - name: Check for existing PR
        if: steps.diff.outputs.changed == 'true'
        id: existing_pr
        run: |
          PR_COUNT=$(gh pr list --head update-resend-spec --state open --json number --jq length)
          echo "exists=$([[ $PR_COUNT -gt 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if PR exists
        if: steps.diff.outputs.changed == 'true' && steps.existing_pr.outputs.exists == 'true'
        run: |
          echo "::notice::Skipping - PR already exists for update-resend-spec branch"
          exit 0

      - name: Update spec file
        if: steps.diff.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        run: cp /tmp/resend-transformed.yaml src/specs/resend.yaml

      - name: Get RFC number
        if: steps.diff.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        id: rfc
        run: |
          LAST_RFC=$(ls docs/rfcs/*.md 2>/dev/null | grep -E '[0-9]{4}-' | sort -r | head -1 | grep -oE '[0-9]{4}' | head -1 || echo "0001")
          NEXT_RFC=$(printf "%04d" $((10#$LAST_RFC + 1)))
          DATE=$(date +%Y-%m-%d)
          echo "number=$NEXT_RFC" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "filename=docs/rfcs/${NEXT_RFC}-spec-update-${DATE}.md" >> $GITHUB_OUTPUT

      - name: Claude Review
        if: steps.diff.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review the OpenAPI spec changes for resend-mcp and create an RFC document.

            ## Instructions
            Read .github/prompts/spec-review.md for detailed review instructions.

            ## Spec Diff
            The diff is saved at .github/spec.diff - read this file to see the changes.

            ## Task
            1. Read .github/spec.diff to see the changes
            2. Read docs/rfcs/TEMPLATE.md for the RFC format
            3. Read scripts/transform_spec.py to understand the operationId mapping system
            4. Create an RFC at: ${{ steps.rfc.outputs.filename }}
            5. Set RFC number to ${{ steps.rfc.outputs.number }}
            6. Set date to ${{ steps.rfc.outputs.date }}
            7. For new endpoints, suggest operationId names following existing conventions
            8. Include a summary of the diff in the RFC (not the full diff)

            Create the RFC markdown file now.
          claude_args: "--dangerously-skip-permissions"

      - name: Cleanup diff file
        if: always()
        run: rm -f .github/spec.diff

      - name: Verify build
        if: steps.diff.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        run: |
          rustup default stable
          cargo check

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: update Resend OpenAPI spec'
          title: 'chore: update Resend OpenAPI spec'
          body: |
            Automated update of the Resend OpenAPI specification.

            ## Source
            https://github.com/resend/resend-openapi/blob/main/resend.yaml

            ## Transformations Applied
            - Added operationId to all endpoints
            - Inlined parameter references
            - Fixed YAML quoting issues

            ## RFC
            See `${{ steps.rfc.outputs.filename }}` for detailed change analysis.

            ---
            *Review the RFC before merging. If new endpoints were added, update `scripts/transform_spec.py` with proper operationId mappings.*
          branch: update-resend-spec
          delete-branch: true
